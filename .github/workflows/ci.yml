name: CI

# CI du dépôt « Merge avec contexte » : typecheck, tests de la logique pure,
# gardes de qualité (taille des fichiers et des fonctions, manifestes Forge,
# synchronisation du contrat partagé), puis les contrôles hérités du socle
# (sanity docs, tests des gardes CI). Verdict en quelques dizaines de
# secondes sur un runner auto-hébergé ; budget dur de 5 minutes.
#
# Le check publié s'appelle `ci` (c'est le nom du job) : il est exigé par le
# ruleset de `main` et par la file Mergify, comme `ci-budget` et `couche0`.
on:
  pull_request:
  # File de merge : même contrôle sur le commit temporaire du groupe.
  merge_group:
  # Contrôle après merge (audit 76) : le hook pre-commit (scripts/shared-sync.mjs
  # hooks) refuse les commits désynchronisés à la source et `merge_group` teste
  # l'arbre de la file ; ce run sur `main` est l'alarme finale si un rebase de
  # la file cassait malgré tout les copies du contrat partagé.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: [self-hosted, linux, x64, merge-avec-contexte-worker]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      # Runners self-hosted persistants : un sous-dossier parasite d'un run
      # précédent peut survivre et fausser les contrôles. Nettoyage complet.
      - name: Nettoyage du workspace
        shell: bash
        run: git clean -ffdx

      # Node n'est pas dans le PATH d'un shell non connecté sur le worker :
      # `~/bin` porte `node`, `npm` et `gh` (posés avec le runner).
      - name: Outillage Node
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/bin:/usr/local/bin:/usr/bin:$PATH"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          node --version
          npm --version

      - name: Dépendances
        shell: bash
        run: npm ci --prefer-offline --no-audit --no-fund

      # Le contrat vit dans `shared/src/` : les copies des deux apps doivent
      # être identiques au fichier près (app Forge = dossier autonome).
      - name: Contrat partagé synchronisé
        shell: bash
        run: npm run shared:check

      - name: Typecheck
        shell: bash
        run: npm run typecheck

      - name: Tests (logique pure, aucun réseau)
        shell: bash
        run: npm test

      # Règle utilisateur : < 500 lignes par fichier, < 50 lignes par fonction.
      - name: Gardes de taille
        shell: bash
        run: npm run limits

      # Ce que la CLI Forge vérifierait : fonctions référencées, handlers
      # exportés, ressources présentes. La CLI n'est pas installée ici.
      - name: Manifestes Forge
        shell: bash
        run: node tools/check-manifests.mjs

      # Le vrai schéma de la plateforme, porté par le paquet @forge/manifest
      # déjà installé (audit 77) : ajv vient de l'arbre, aucune dépendance ajoutée.
      - name: Schéma des manifestes (@forge/manifest)
        shell: bash
        run: node tools/check-manifest-schema.mjs

      # Conventions TypeScript du dépôt contrôlées sur l'AST (audit 75) :
      # imports sans extension, @forge/* interdit en logique pure, console.*
      # et Date.now() bornés — voir docs/CONVENTIONS.md.
      - name: Style et conventions TypeScript
        shell: bash
        run: npm run lint

      - name: Sanity docs (UTF-8, non vides)
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          exts = {".md", ".mdx", ".txt"}
          vides, illisibles, total = [], [], 0
          ignores = (".git/", "node_modules/", "dist/", "coverage/")
          for f in sorted(pathlib.Path(".").rglob("*")):
              if any(m in f.as_posix() for m in ignores) or f.suffix.lower() not in exts:
                  continue
              total += 1
              try:
                  contenu = f.read_text(encoding="utf-8")
              except (OSError, UnicodeError):
                  illisibles.append(f.as_posix())
                  continue
              if not contenu.strip():
                  vides.append(f.as_posix())
          print("%d doc(s) contrôlé(s)" % total)
          for f in illisibles:
              print("::error::illisible en UTF-8 : %s" % f)
          for f in vides:
              print("::error::document vide : %s" % f)
          raise SystemExit(1 if (illisibles or vides) else 0)
          PY

      # Les gardes de la CI se testent elles-mêmes : couche0 + agents de la
      # file (résolution de conflit, réparation de test, périmètre).
      - name: Tests des gardes CI (couche0, fireworks)
        shell: bash
        run: |
          python3 .github/couche0/test_check_couche0.py
          python3 .github/fireworks/test_conflict_agent.py
          python3 .github/fireworks/test_test_agent.py
          python3 .github/fireworks/test_scope_agent.py
          python3 .github/fireworks/test_union_journal.py
          python3 .github/fireworks/test_quota.py

      # Les gardes outillage se testent elles-mêmes aussi (node:test,
      # bibliothèque standard de Node — audit 75, 76, 77, 78, 79).
      - name: Tests des gardes outillage (tools)
        shell: bash
        run: node --test tools/selftests/*.test.mjs
