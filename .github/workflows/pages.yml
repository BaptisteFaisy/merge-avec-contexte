name: pages

# Publie `site/` sur GitHub Pages (dépôt public : hébergement gratuit).
# Déclenché à chaque merge sur main et à la main. Le travail tourne sur les
# runners hébergés de GitHub, pas sur le pool auto-hébergé de la CI : publier
# un site statique ne doit pas consommer les runners des PR.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
