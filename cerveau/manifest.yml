# Cerveau — app Forge Jira.
#
# Clés de modules vérifiées dans la référence Forge (voir docs/FORGE-API-NOTES.md) :
#   webtrigger, jira:projectSettingsPage, jira:issueContext, jira:projectPage,
#   action, rovo:agent, rovo:mcp, trigger, sql.
#
# Le Cerveau porte toutes les données durables : règles, gels, dérogations,
# journal, cache de tickets et d'incidents (§14).
app:
  id: ari:cloud:ecosystem::app/8361630d-9d57-4099-9c2b-5201bb00648d
  runtime:
    name: nodejs22.x

modules:
  # Le pont signé : seule porte d'entrée du Capteur. Aucune authentification
  # Forge par défaut — d'où la signature HMAC obligatoire (§13.3).
  webtrigger:
    - key: pont-bitbucket
      function: gererPont
      urlFormat: v2
      response:
        type: dynamic

  jira:projectSettingsPage:
    - key: reglages-projet
      title: Merge avec contexte
      resource: reglages-projet
      render: native
      resolver:
        function: resolver-reglages

  jira:issueContext:
    - key: encart-ticket
      title: Merge avec contexte
      label: Merge avec contexte
      resource: encart-ticket
      render: native
      resolver:
        function: resolver-encart

  jira:projectPage:
    - key: console-journal
      title: Merge avec contexte — console et journal
      resource: console-journal
      render: native
      resolver:
        function: resolver-console

  # Actions exposées à l'agent Rovo et, par rovo:mcp, aux clients MCP (§11).
  action:
    - key: evaluate-merge
      name: Évaluer une fusion
      function: evaluateMerge
      actionVerb: GET
      description: Évaluation à blanc des règles de contexte pour un ticket, sans
        fusion réelle.
      inputs:
        issueKey:
          title: Clé du ticket
          description: Clé du ticket Jira concerné, par exemple PAY-123.
          type: string
          required: true
        targetBranch:
          title: Branche cible
          description: Branche cible de la pull request, par exemple main.
          type: string
          required: false
        repository:
          title: Dépôt
          description: Nom ou identifiant du dépôt Bitbucket concerné.
          type: string
          required: false
    - key: explain-block
      name: Expliquer un blocage
      function: explainBlock
      actionVerb: GET
      description: Dernière évaluation réelle des PR d'un ticket, avec les raisons du
        blocage.
      inputs:
        issueKey:
          title: Clé du ticket
          description: Clé du ticket Jira concerné, par exemple PAY-123.
          type: string
          required: true
    - key: list-freezes
      name: Lister les gels
      function: listFreezes
      actionVerb: GET
      description: Gels de déploiement en cours et à venir.
      inputs:
        days:
          title: Horizon en jours
          description: Horizon en jours pour les gels à venir (7 par défaut).
          type: number
          required: false
    - key: list-waivers
      name: Lister les dérogations
      function: listWaivers
      actionVerb: GET
      description: Dérogations en cours pour un ticket.
      inputs:
        issueKey:
          title: Clé du ticket
          description: Clé du ticket Jira concerné, par exemple PAY-123.
          type: string
          required: true
    - key: list-approvers
      name: Lister les approbateurs
      function: listApprovers
      actionVerb: GET
      description: Personnes habilitées à accorder une dérogation. Lecture seule,
        aucune demande n'est enregistrée.
      inputs:
        issueKey:
          title: Clé du ticket
          description: Clé du ticket Jira concerné, par exemple PAY-123. Sans elle,
            l'annuaire de l'installation est rendu.
          type: string
          required: false
    - key: request-waiver
      name: Demander une dérogation
      function: requestWaiver
      actionVerb: CREATE
      description: Enregistre une demande de dérogation et notifie les approbateurs.
      inputs:
        issueKey:
          title: Clé du ticket
          description: Clé du ticket Jira concerné, par exemple PAY-123.
          type: string
          required: true
        ruleCode:
          title: Code de la règle
          description: Code de la règle à déroger, par exemple R-04.
          type: string
          required: true
        reason:
          title: Motif
          description: Motif de la dérogation, tel qu'il apparaîtra dans le journal.
          type: string
          required: true
        hours:
          title: Durée en heures
          description: Durée demandée en heures, entre 1 et 72.
          type: number
          required: true

  rovo:agent:
    - key: agent-merge-contexte
      name: Merge avec contexte
      prompt: |
        Tu réponds aux questions sur les fusions de pull requests et leur contexte :
        ticket Jira lié, critères d'acceptation, gels de déploiement, incidents en cours,
        dépendances et versions. Tu t'appuies toujours sur les actions fournies
        (evaluate-merge, explain-block, list-freezes, list-waivers, list-approvers,
        request-waiver) et jamais sur une supposition. Tu expliques chaque blocage avec
        l'action attendue, dans la langue de l'utilisateur. Tu ne promets pas une
        dérogation : list-approvers nomme qui peut l'accorder, request-waiver enregistre
        la demande.
      conversationStarters:
        - Pourquoi la PR de PAY-123 est-elle bloquée ?
        - Puis-je fusionner PAY-123 maintenant ?
        - Quels gels sont prévus cette semaine ?
        - Qui peut m'accorder une dérogation ?
      actions:
        - evaluate-merge
        - explain-block
        - list-freezes
        - list-waivers
        - list-approvers
        - request-waiver

  rovo:mcp:
    - key: cerebro-mcp
      name: Merge avec contexte
      tools:
        - evaluate-merge
        - explain-block
        - list-freezes
        - list-waivers
        - list-approvers
        - request-waiver

  # Événements Jira : tiennent le cache à jour (§13.4).
  trigger:
    - key: ticket-modifie
      function: surTicketModifie
      events:
        - avi:jira:created:issue
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true

  # Les migrations de schéma tournent hors des requêtes utilisateur (Forge
  # limite les DDL à 25 par minute) : un déclencheur horaire les rejoue.
  scheduledTrigger:
    - key: migrations-schema
      function: migrerSchema
      interval: hour

  # Forge SQL : règles, gels, dérogations, journal, caches (§14).
  sql:
    - key: main
      engine: mysql

  function:
    - key: gererPont
      handler: index.gererPont
    - key: resolver-reglages
      handler: index.resolverReglages
    - key: resolver-encart
      handler: index.resolverEncart
    - key: resolver-console
      handler: index.resolverConsole
    - key: evaluateMerge
      handler: index.evaluateMerge
    - key: explainBlock
      handler: index.explainBlock
    - key: listFreezes
      handler: index.listFreezes
    - key: listWaivers
      handler: index.listWaivers
    - key: listApprovers
      handler: index.listApprovers
    - key: requestWaiver
      handler: index.requestWaiver
    - key: surTicketModifie
      handler: index.surTicketModifie
    - key: migrerSchema
      handler: index.migrerSchema

resources:
  - key: reglages-projet
    path: src/frontend/reglages-projet.jsx
  - key: encart-ticket
    path: src/frontend/encart-ticket.jsx
  - key: console-journal
    path: src/frontend/console-journal.jsx

permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - manage:jira-configuration
    - read:chat:rovo
    - storage:app
  external:
    fetch:
      backend:
        - address: "*.atlassian.net"
